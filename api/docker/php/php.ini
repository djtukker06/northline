; PHP runtime settings for this project. In production you would tune these
; further; the values here favour clear errors during development.

memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 16M
post_max_size = 16M

; Show errors in the log rather than in the HTTP response. Leaking a stack trace
; to a browser tells an attacker your file paths and library versions.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache keeps compiled PHP in shared memory instead of recompiling every request.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Development setting: notice edited files immediately. Set to 0 in production
; and deploy by restarting the container, which is both faster and safer.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = Europe/Amsterdam
