# nginx configuration for the API.
#
# nginx is the first thing an incoming request meets. It decides what to serve
# itself and what to pass to PHP. Everything in a Laravel application goes through
# a single entry point, public/index.php, which is what the try_files line below
# arranges. That pattern is called a front controller.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16M;

    # Security headers. These instruct the browser to be stricter than its default.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Never serve the request as a static file if it does not exist; hand it to
    # index.php so the router can decide. $query_string preserves ?page=2 etc.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Requests for .php files are proxied to php-fpm over the FastCGI protocol.
    # "php:9000" is the php service from docker-compose on its container port.
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Dotfiles such as .env must never be reachable over HTTP. This is the single
    # most common way a database password leaks from a PHP project.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;
}
